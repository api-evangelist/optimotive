aid: optimotive
name: Optimotive
description: >-
  Optimotive is an autonomous-robotics company building a vertically integrated fleet
  of advanced robots for the toughest, most extreme environments across construction,
  mining, and oil and gas. Its robots take on the mundane, repetitive, and hazardous
  tasks that burden human workers, doing it cost-effectively. Two products are already
  deployed with major market players: IRIS, a wheeled autonomous robot that captures
  large-scale site data, and BOX, which provides a reliable home base and on-site
  infrastructure for entirely self-sufficient robots. Two more robots are joining the
  fleet: MULE for onsite material handling and SCRUBBLES for site cleanup. The company
  is vertically integrated from developing its own AI to 3D printing its robots, owning
  the full hardware and software stack. Founded by CEO Scott Fairley and based in
  Windsor, Ontario, Canada, Optimotive raised a 2M USD seed round led by Version One
  Ventures in September 2024, with participation from Garage and NewLab. As a physical
  robotics hardware business, Optimotive publishes no public API, developer portal, or
  SDK at this time.
